[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vwp"
version = "0.0.0"
description = "Planned Python SDK for VWP (Verifiable Work Product). Status: stub - see cli/ for the working reference verifier."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[tool.setuptools]
packages = ["vwp"]
